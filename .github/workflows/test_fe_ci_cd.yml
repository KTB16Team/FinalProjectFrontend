name: Frontend CI Workflow

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 레포지토리 체크아웃
      - uses: actions/checkout@v4

      # Node.js 설치
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '16'

      # .env 파일 생성 및 VITE_BACKEND_URL 설정 (GitHub Secrets 사용)
      - name: Create .env file with VITE_BACKEND_URL from Secrets
        run: echo "VITE_BACKEND_URL=${{ secrets.BE_URL }}" > frontend/.env

      # 디렉토리 이동 (package.json 위치)
      - name: Navigate to project directory
        run: cd frontend

      # 의존성 설치
      - name: Install dependencies
        run: npm install
        working-directory: ./frontend

      # 프론트엔드 빌드
      - name: Build project
        run: npm run build
        working-directory: ./frontend

      # AWS CLI 설치
      - name: Install AWS CLI
        run: sudo apt-get install -y awscli

      # AWS 자격 증명 설정
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_S3_IAM_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_S3_IAM_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2  # 서울 리전

      # 빌드된 파일을 S3에 업로드
      - name: Deploy to S3
        run: |
          aws s3 sync ./frontend/dist/ s3://${{ secrets.S3_BUCKET_NAME }} --delete

      # CloudFront 캐시 무효화 단계 추가
      - name: Create CloudFront Invalidation
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_S3_IAM_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_S3_IAM_SECRET_ACCESS_KEY }}

      # S3 업로드 성공 시 디스코드 알림 전송
      - name: Notify Discord
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
            -d '{"content": "S3에 파일이 성공적으로 업로드되었습니다!"}' \
            https://discord.com/api/webhooks/1297841409314918400/q48PQoKwPJ6Sm9895nRFstQSqzpWZjbR_WLq_p3sr3jM1dVi9qV-kGTQV6lPwTwcQ_Wf
